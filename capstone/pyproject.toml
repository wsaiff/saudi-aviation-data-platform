
[project]
name = "saudi-aviation-platform"
version = "0.1.0"
description = "Saudi Aviation Infrastructure and Data Platform"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery>=3.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "streamlit>=1.30",
    "pyarrow==26.0.0",
    "requests==2.34.2",
]

[tool.setuptools.packages.find]
include = ["shared*", "ingestion*", "dashboard*"]
