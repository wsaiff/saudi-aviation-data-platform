
[project]
name = "saudi-aviation-platform"
version = "0.1.0"
description = "Saudi Aviation Infrastructure and Data Platform"
requires-python = ">=3.11"
dependencies = [
    "db-dtypes>=1.2,<2",
    "dbt-bigquery>=1.12,<1.13",
    "google-cloud-bigquery==3.46.1",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "python-dotenv>=1.0",
    "pyarrow==25.0.1",
    "requests==2.34.2",
    "streamlit==1.65.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "ingestion*", "dashboard*"]
